<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>삼단논법 게시판</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/vis-network.min.css">

<style>
  :root{
    --bg:#12181a;
    --panel:#1b2325;
    --panel-2:#212b2d;
    --chalk:#f3f1e7;
    --chalk-dim:#a9b6b4;
    --accent:#e8c468;
    --accent-dim:#b98f3a;
    --blue:#7fb3d5;
    --pink:#e2a6c5;
    --danger:#e08585;
    --danger-dim:#a94d4d;
    --ok:#8fcb9b;
    --line: rgba(243,241,231,0.16);
    --radius: 10px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(232,196,104,0.05), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(127,179,213,0.06), transparent 45%),
      var(--bg);
    color:var(--chalk);
    font-family:'IBM Plex Sans KR', -apple-system, sans-serif;
    min-height:100vh;
    padding:28px 12px 64px;
  }

  .board{ max-width:820px; margin:0 auto; }

  header{ margin-bottom:28px; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.14em; font-size:12px; color:var(--accent); margin:0 0 10px; text-transform:uppercase; }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(24px,5.5vw,34px); margin:0 0 8px; letter-spacing:-0.01em; }
  .sub{ color:var(--chalk-dim); font-size:13.5px; margin:0; line-height:1.6; }
  .hidden{ display:none !important; }

  /* ---------- input groups ---------- */
  .group{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 10px 10px; margin-bottom:14px; position:relative; }
  .group-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; color:var(--chalk-dim); text-transform:uppercase; margin-bottom:10px; padding:0 4px; display:flex; align-items:center; justify-content:space-between; }
  .group-remove{ background:none; border:none; color:var(--danger); font-family:'IBM Plex Mono', monospace; font-size:11px; cursor:pointer; opacity:0.7; letter-spacing:0.05em; }
  .group-remove:hover{ opacity:1; text-decoration:underline; }

  .row{ display:flex; flex-wrap:nowrap; align-items:center; gap:3px; padding:7px 2px; border-bottom:1px dashed var(--line); }
  .row:last-child{ border-bottom:none; }
  .row > *{ flex-shrink:1; min-width:0; }

  .badge{ flex:0 0 auto; width:18px; height:18px; border:1px solid var(--accent-dim); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--accent); }

  select, input[type="text"]{ background:transparent; border:none; color:var(--chalk); font-family:'IBM Plex Sans KR', sans-serif; outline:none; border-radius:0; appearance:none; -webkit-appearance:none; min-width:0; }
  input[type="text"]{ border-bottom:1px dashed var(--line); padding:5px 2px; font-size:12.5px; flex:1 1 32px; width:16px; }
  input[type="text"]::placeholder{ color:rgba(169,182,180,0.45); }
  input[type="text"]:focus, select:focus{ border-bottom-color:var(--accent); }

  select{
    border-bottom:1px solid var(--line);
    background-image: linear-gradient(45deg, transparent 50%, var(--chalk-dim) 50%), linear-gradient(135deg, var(--chalk-dim) 50%, transparent 50%);
    background-position: calc(100% - 8px) 55%, calc(100% - 4px) 55%;
    background-size: 4px 4px, 4px 4px;
    background-repeat:no-repeat;
    padding:5px 14px 5px 3px;
    font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; color:var(--chalk-dim);
  }
  select.quant{ flex:0 1 46px; width:46px; color:var(--blue); font-weight:500; }
  select.particle{ flex:0 1 58px; width:58px; }
  select.copula{ flex:0 1 52px; width:52px; color:var(--accent); font-weight:500; }
  option{ background:var(--panel-2); color:var(--chalk); }

  @media (max-width:380px){
    .badge{ width:15px; height:15px; font-size:8.5px; }
    select.quant{ flex-basis:38px; width:38px; font-size:10px; padding-right:11px; }
    select.particle{ flex-basis:46px; width:46px; font-size:9px; padding-right:11px; }
    select.copula{ flex-basis:42px; width:42px; font-size:9px; padding-right:11px; }
    input[type="text"]{ font-size:11px; }
    .row{ gap:2px; }
  }

  /* ---------- buttons ---------- */
  .actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .btn{ font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.03em; padding:12px 18px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--chalk); cursor:pointer; transition: border-color .15s ease, background .15s ease, color .15s ease; flex:1 1 auto; text-align:center; }
  .btn:hover{ border-color:var(--chalk-dim); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:#1b1503; border-color:var(--accent); font-weight:600; flex:2 1 auto; }
  .btn-primary:hover{ background:#f0cf7c; }
  .btn-ghost{ color:var(--chalk-dim); }
  .btn-secondary{ border-color:var(--blue); color:var(--blue); }
  .btn-secondary:hover{ background:rgba(127,179,213,0.08); }
  .btn.small{ padding:8px 12px; font-size:11.5px; flex:0 0 auto; }

  /* ---------- result view ---------- */
  .result-card, .eval-card, .stats-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 12px; margin-bottom:14px; }
  .result-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
  .result-head h2, .eval-card h3, .stats-card h3{ font-family:'Space Grotesk', sans-serif; font-size:16px; margin:0 0 12px; font-weight:700; }
  #network{
    height:440px; width:100%;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/28px 28px,
      var(--panel-2);
    border-radius:8px; border:1px solid var(--line);
    overflow:hidden;
    position:relative;
  }
  #network.diagram-mode{ cursor:grab; touch-action:none; }
  #network.diagram-mode:active{ cursor:grabbing; }
  #network svg{ display:block; width:100%; height:100%; }
  .diagram-shape{ cursor:grab; }
  .diagram-shape:active{ cursor:grabbing; }
  .hint{ font-size:11.5px; color:var(--chalk-dim); margin:9px 2px 0; line-height:1.6; }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--chalk-dim); margin-top:11px; font-family:'IBM Plex Mono', monospace; align-items:center; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:15px; height:0; display:inline-block; }
  .legend i.ls-solid{ border-top:2px solid var(--chalk-dim); }
  .legend i.ls-dashed{ border-top:2px dashed var(--chalk-dim); }
  .legend i.ls-premise{ border-top:3px solid #7fb3d5; }
  .legend i.ls-conclusion{ border-top:3px solid #e8c468; }
  .legend i.ls-exception{ border-top:3px solid #ffffff; }
  .legend i.ls-contradiction{ border-top:3px solid #111111; }
  .legend b{ color:var(--danger); font-style:normal; }
  .legend svg{ display:block; }

  .eval-card ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .eval-card li{ font-size:13px; line-height:1.55; padding:10px 11px; border-radius:6px; border-left:3px solid var(--danger); background:rgba(224,133,133,0.08); color:var(--chalk); }
  .eval-card li.ok{ border-left-color:var(--ok); background:rgba(143,203,155,0.08); }
  .eval-card li.info{ border-left-color:var(--blue); background:rgba(127,179,213,0.08); }

  .stats-grid{ display:flex; flex-wrap:wrap; gap:10px; }
  .stat-chip{
    flex:1 1 140px; min-width:140px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 12px 10px;
  }
  .stat-chip .stat-value{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; color:var(--chalk); line-height:1.1; }
  .stat-chip .stat-value b{ font-size:13px; font-weight:500; color:var(--chalk-dim); margin-left:2px; }
  .stat-chip .stat-label{ font-size:11.5px; color:var(--chalk-dim); margin-top:5px; line-height:1.4; }
  .stat-chip.warn .stat-value{ color:var(--danger); }
  .stat-chip.ok .stat-value{ color:var(--ok); }
  .stat-chip .stat-sub{ font-size:10.5px; color:var(--chalk-dim); margin-top:3px; font-family:'IBM Plex Mono', monospace; }

  .zoom-controls{ position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:4px; z-index:5; }
  .zoom-controls button{ width:28px; height:28px; border-radius:6px; border:1px solid var(--line); background:rgba(27,35,37,0.85); color:var(--chalk); font-family:'IBM Plex Mono',monospace; font-size:15px; cursor:pointer; line-height:1; }
  .zoom-controls button:hover{ border-color:var(--chalk-dim); }

  @media (max-width:520px){ #network{ height:380px; } }

  /* ---------- ad bar (Coupang Partners) ---------- */
  #ad-bar{
      flex:0 0 auto;
      display:flex; flex-direction:column; align-items:center;
      gap:4px;
      padding:2px 0 10px 0;
      position:relative; z-index:5;
  }
  #ad-bar .ad-disclosure{
      font-size:10px; color:var(--text-dim); letter-spacing:0.01em; text-align:center;
      padding:0 14px;
  }
  #ad-bar .ad-slot{
      min-height:50px; min-width:240px;
      display:flex; align-items:center; justify-content:center;
  }

</style>
</head>
<body>

<div class="board">

  <header>
    <p class="eyebrow">Syllogism Board · 三段論法</p>
    <h1>삼단논법 게시판</h1>
    <p class="sub">문장을 입력하면 그래프와 원·부채꼴 다이어그램으로 그려주고, 9가지 표준 삼단논법 형식에 맞는지 판정합니다.</p>
  </header>

  <!-- ============ INPUT VIEW ============ -->
  <main id="inputView">
    <div id="groups"></div>
    <div class="actions">
      <button id="addBtn" class="btn btn-ghost">+ 추가</button>
      <button id="doneBtn" class="btn btn-primary">완료</button>
    </div>
    <div class="actions">
      <button id="saveFileBtn" class="btn btn-ghost small">파일로 저장</button>
      <button id="loadFileBtn" class="btn btn-ghost small">파일 불러오기</button>
      <input type="file" id="loadFileInput" accept="application/json,.json" style="display:none;">
    </div>
  </main>

  <!-- ============ RESULT VIEW ============ -->
  <main id="resultView" class="hidden">

    <div class="result-card">
      <div class="result-head">
        <h2 id="viewTitle">논리 그래프</h2>
        <button id="saveImgBtn" class="btn btn-ghost small">이미지로 저장</button>
      </div>
      <div id="network"></div>
      <p class="hint" id="dragHint"></p>
      <div class="legend" id="legendBox"></div>
    </div>

    <div class="stats-card" id="statsCard">
      <h3>그래프 통계</h3>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="eval-card">
      <h3>논리성 평가</h3>
      <ul id="evalList"></ul>
    </div>

    <div class="actions">
      <button id="toggleBtn" class="btn btn-secondary">다이어그램으로 보기</button>
      <button id="backBtn" class="btn btn-ghost">다시 입력하기</button>
    </div>
  </main>

</div>

<div id="result"></div>
  <div id="ad-bar">
    <div class="ad-disclosure">이 앱은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
    <div class="ad-slot">
      <script src="https://ads-partners.coupang.com/g.js"></script>
      <script>
          new PartnersCoupang.G({"id":1000572,"trackingCode":"AF0795367","subId":null,"template":"carousel","width":"280","height":"50"});
      </script>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
(function(){
  "use strict";

  var groupsEl = document.getElementById('groups');
  var groupCount = 0;

  var PARTICLE_OPTS = ['은','는','이 아닌 것은','가 아닌 것은'];
  var COPULA_OPTS   = ['이다','다','가 아니다','이 아니다'];

  function optionsHTML(list){
    return list.map(function(v){ return '<option value="'+v+'">'+v+'</option>'; }).join('');
  }

  function rowHTML(){
    return (
      '<div class="row">' +
        '<span class="badge js-badge-l"></span>' +
        '<select class="quant"><option value="모든">모든</option><option value="어떤">어떤</option></select>' +
        '<input type="text" class="wordLeft" placeholder="단어">' +
        '<select class="particle">' + optionsHTML(PARTICLE_OPTS) + '</select>' +
        '<input type="text" class="wordRight" placeholder="단어">' +
        '<span class="badge js-badge-r"></span>' +
        '<select class="copula">' + optionsHTML(COPULA_OPTS) + '</select>' +
      '</div>'
    );
  }

  function addGroup(){
    groupCount++;
    var g = document.createElement('div');
    g.className = 'group';
    g.dataset.groupId = groupCount;
    var removeBtn = groupCount > 1 ? '<button type="button" class="group-remove" onclick="this.closest(\'.group\').remove(); window.__renumber();">삭제</button>' : '';
    g.innerHTML =
      '<div class="group-label"><span>세트 ' + groupCount + '</span>' + removeBtn + '</div>' +
      rowHTML() + rowHTML() + rowHTML();
    groupsEl.appendChild(g);
    renumberBadges();
  }

  function renumberBadges(){
    var rows = groupsEl.querySelectorAll('.row');
    var n = 1;
    rows.forEach(function(row){
      row.querySelector('.js-badge-l').textContent = n++;
      row.querySelector('.js-badge-r').textContent = n++;
    });
  }
  window.__renumber = renumberBadges;

  document.getElementById('addBtn').addEventListener('click', addGroup);
  addGroup();

  // ---------------------------------------------------------------
  // Save / load the current input as a JSON file, so a session can be
  // resumed later without retyping everything.
  // ---------------------------------------------------------------
  function exportGroupsForFile(){
    var groups = [];
    groupsEl.querySelectorAll('.group').forEach(function(gEl){
      var rows = [];
      gEl.querySelectorAll('.row').forEach(function(row){
        rows.push({
          quant: row.querySelector('.quant').value,
          wordLeft: row.querySelector('.wordLeft').value,
          particle: row.querySelector('.particle').value,
          wordRight: row.querySelector('.wordRight').value,
          copula: row.querySelector('.copula').value
        });
      });
      groups.push(rows);
    });
    return groups;
  }

  function importGroupsFromFile(groups){
    if(!Array.isArray(groups) || groups.length === 0){
      alert('올바른 형식의 파일이 아닙니다.');
      return;
    }
    groupsEl.innerHTML = '';
    groupCount = 0;
    groups.forEach(function(rows){
      groupCount++;
      var g = document.createElement('div');
      g.className = 'group';
      g.dataset.groupId = groupCount;
      var removeBtn = groupCount > 1 ? '<button type="button" class="group-remove" onclick="this.closest(\'.group\').remove(); window.__renumber();">삭제</button>' : '';
      var rowsHtml = rowHTML() + rowHTML() + rowHTML();
      g.innerHTML = '<div class="group-label"><span>세트 ' + groupCount + '</span>' + removeBtn + '</div>' + rowsHtml;
      groupsEl.appendChild(g);
      var rowEls = g.querySelectorAll('.row');
      rowEls.forEach(function(rowEl, idx){
        var r = (rows && rows[idx]) || {};
        if(r.quant) rowEl.querySelector('.quant').value = r.quant;
        if(r.wordLeft !== undefined) rowEl.querySelector('.wordLeft').value = r.wordLeft;
        if(r.particle) rowEl.querySelector('.particle').value = r.particle;
        if(r.wordRight !== undefined) rowEl.querySelector('.wordRight').value = r.wordRight;
        if(r.copula) rowEl.querySelector('.copula').value = r.copula;
      });
    });
    renumberBadges();
  }

  document.getElementById('saveFileBtn').addEventListener('click', function(){
    var payload = { type:'삼단논법-게시판', version:1, savedAt:new Date().toISOString(), groups: exportGroupsForFile() };
    var json = JSON.stringify(payload, null, 2);
    var blob = new Blob([json], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '삼단논법_입력.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('loadFileBtn').addEventListener('click', function(){
    document.getElementById('loadFileInput').click();
  });
  document.getElementById('loadFileInput').addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        var groups = Array.isArray(data) ? data : data.groups;
        importGroupsFromFile(groups);
      }catch(err){
        alert('파일을 읽을 수 없습니다: ' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
    e.target.value = '';
  });

  // ---------------------------------------------------------------
  // Raw statement extraction
  // ---------------------------------------------------------------
  function rowToRaw(row){
    var quant = row.querySelector('.quant').value;
    var subj = row.querySelector('.wordLeft').value.trim();
    var particle = row.querySelector('.particle').value;
    var pred = row.querySelector('.wordRight').value.trim();
    var copula = row.querySelector('.copula').value;
    var subjNeg = (particle === '이 아닌 것은' || particle === '가 아닌 것은');
    var predNeg = (copula === '가 아니다' || copula === '이 아니다');
    return { quant:quant, subj:subj, subjNeg:subjNeg, pred:pred, predNeg:predNeg };
  }

  function collectFlatRaw(){
    var rows = groupsEl.querySelectorAll('.row');
    var list = [];
    rows.forEach(function(row){
      var r = rowToRaw(row);
      if(r.subj && r.pred) list.push(r);
    });
    return list;
  }

  function collectGroupedRaw(){
    var groupEls = groupsEl.querySelectorAll('.group');
    var groups = [];
    groupEls.forEach(function(gEl, idx){
      var rowEls = gEl.querySelectorAll('.row');
      var rows = [];
      rowEls.forEach(function(row){ rows.push(rowToRaw(row)); });
      var complete = rows.length === 3 && rows.every(function(r){ return r.subj && r.pred; });
      groups.push({ index: idx+1, rows: rows, complete: complete });
    });
    return groups;
  }

  function labelOf(word, neg){ return word + (neg ? '×' : ''); }

  // Given one input group (up to 3 rows), compute the edges that should be
  // drawn/analysed for it — same contrapositive rewrite used by both the
  // graph and the statistics below, kept in one place so they never disagree.
  function computeGroupEdges(group){
    var rewriteRowIndex = -1;
    if(group.rows.length === 3 && group.rows.every(function(r){ return r.subj && r.pred; })){
      var m = matchGroup(group.rows);
      if(m && m.template.id === 8 && typeof m.p1RowIndex === 'number'){
        var p1Raw = group.rows[m.p1RowIndex];
        if(!p1Raw.subjNeg){ rewriteRowIndex = m.p1RowIndex; }
      }
    }
    var result = [];
    group.rows.forEach(function(r, idx){
      if(!r.subj || !r.pred) return;
      var fromLabel, toLabel, solid;
      if(idx === rewriteRowIndex){
        // contrapositive of "모든 subj는 pred이다": 모든 (pred가 아닌 것)은 (subj가 아닌 것)이다
        fromLabel = labelOf(r.pred, true);
        toLabel = labelOf(r.subj, true);
        solid = true;
      } else {
        fromLabel = labelOf(r.subj, r.subjNeg);
        toLabel = labelOf(r.pred, r.predNeg);
        solid = (r.quant === '모든');
      }
      result.push({ rowIndex:idx, fromLabel:fromLabel, toLabel:toLabel, solid:solid,
        role: (idx === 2 ? 'conclusion' : 'premise') });
    });
    return result;
  }

  // ---------------------------------------------------------------
  // GRAPH data (floating network). Overlapping same-direction arrows
  // (same fromLabel->toLabel, however many rows produced them) are drawn
  // as a single merged edge — solid wins over dashed if both occur.
  // A<->B in opposite directions stay separate.
  //
  // Edge colour encodes ROLE (premise vs conclusion) within whichever
  // triangle it belongs to — dashing already shows 모든/어떤, so colour is
  // free for that. If a merged edge's role isn't the same in every
  // triangle it appears in (or it never closes a real triangle at all) we
  // can't pick a side, so it's drawn white. A special case overrides all
  // of that: if the same source has a *solid* ("모든") arrow to both X and
  // its negation X×, that's a direct contradiction, and both arrows are
  // drawn black regardless of role.
  //
  // Terms that appear both as X and X× are drawn as a fused two-tone
  // capsule (two touching boxes, "X" then "X×") instead of two separate
  // floating circles, so an arrow aimed at X and one aimed at X× visibly
  // land on the correct half of the same "button".
  // ---------------------------------------------------------------
  var PREMISE_COLOR = '#7fb3d5';
  var CONCLUSION_COLOR = '#e8c468';
  var NO_ROLE_COLOR = '#ffffff';
  var CONTRADICTION_COLOR = '#111111';
  var PAIR_BOX_W = 52, PAIR_BOX_H = 34;

  function buildGraphAndTriples(groupedRaw){
    // 1) raw edges per group, plus whether that group closes into a triangle
    var rawByGroup = [];
    groupedRaw.forEach(function(group){
      var ge = computeGroupEdges(group);
      var middleLabel = null;
      if(ge.length === 3){
        var s1 = [ge[0].fromLabel, ge[0].toLabel], s2 = [ge[1].fromLabel, ge[1].toLabel];
        s1.forEach(function(l){ if(s2.indexOf(l) !== -1) middleLabel = l; });
      }
      rawByGroup.push({ edges:ge, hasTriangle: !!middleLabel, middleLabel:middleLabel });
    });

    // 2) merge same-direction duplicate edges
    var mergedMap = new Map(); // "from\u0001to" -> {fromLabel,toLabel,solid,occurrences:[{role,hasTriangle}]}
    rawByGroup.forEach(function(gInfo){
      gInfo.edges.forEach(function(e){
        var key = e.fromLabel + '\u0001' + e.toLabel;
        if(!mergedMap.has(key)){
          mergedMap.set(key, { fromLabel:e.fromLabel, toLabel:e.toLabel, solid:false, occurrences:[] });
        }
        var m = mergedMap.get(key);
        if(e.solid) m.solid = true; // solid wins over dashed
        m.occurrences.push({ role:e.role, hasTriangle:gInfo.hasTriangle });
      });
    });

    // 3) finalize merged edges: id, stats-role (conclusion wins, used for
    // counting), colour-role (only trusted when consistent within the
    // triangle(s) it actually closes)
    var mergedEdges = [];
    var edgeKeyToId = {};
    var ec = 0;
    mergedMap.forEach(function(m, key){
      var id = 'e' + (ec++);
      var statsRole = m.occurrences.some(function(o){ return o.role === 'conclusion'; }) ? 'conclusion' : 'premise';
      var triangleOccs = m.occurrences.filter(function(o){ return o.hasTriangle; });
      var colorRole = 'ambiguous';
      if(triangleOccs.length > 0){
        var roles = {};
        triangleOccs.forEach(function(o){ roles[o.role] = true; });
        var roleKeys = Object.keys(roles);
        if(roleKeys.length === 1) colorRole = roleKeys[0];
      }
      mergedEdges.push({ id:id, fromLabel:m.fromLabel, toLabel:m.toLabel, solid:m.solid,
        statsRole:statsRole, colorRole:colorRole });
      edgeKeyToId[key] = id;
    });

    // 4) contradictions: same source, solid arrows to both X and X×
    var bySource = {};
    mergedEdges.forEach(function(e){
      if(!e.solid) return;
      bySource[e.fromLabel] = bySource[e.fromLabel] || [];
      bySource[e.fromLabel].push(e);
    });
    var contradictionIds = {};
    Object.keys(bySource).forEach(function(src){
      var list = bySource[src];
      list.forEach(function(e1){
        list.forEach(function(e2){
          if(e1 === e2) return;
          var base1 = e1.toLabel.replace('×',''), neg1 = e1.toLabel.indexOf('×') !== -1;
          var base2 = e2.toLabel.replace('×',''), neg2 = e2.toLabel.indexOf('×') !== -1;
          if(base1 === base2 && neg1 !== neg2){ contradictionIds[e1.id] = true; contradictionIds[e2.id] = true; }
        });
      });
    });

    // 5) nodes (+ pairing X / X× into one fused capsule)
    function styleFor(label){
      var negated = label.indexOf('×') !== -1;
      if(negated){
        return { color:{ background:'#e08585', border:'#a94d4d', highlight:{background:'#eaa0a0', border:'#a94d4d'} }, font:{ color:'#1b0e0e' } };
      }
      return { color:{ background:'#e8c468', border:'#b98f3a', highlight:{background:'#f0d484', border:'#b98f3a'} }, font:{ color:'#14181a' } };
    }
    var nodeMap = new Map(), nodes = [];
    function ensureNode(label){
      if(!nodeMap.has(label)){
        var id = nodeMap.size + 1;
        nodeMap.set(label, id);
        var style = styleFor(label);
        nodes.push({ id:id, label:label, shape:'ellipse',
          font:Object.assign({face:'IBM Plex Mono', size:16}, style.font),
          borderWidth:2, margin:10, color:style.color });
      }
      return nodeMap.get(label);
    }
    mergedEdges.forEach(function(e){ ensureNode(e.fromLabel); ensureNode(e.toLabel); });

    var labelToNode = {};
    nodes.forEach(function(n){ labelToNode[n.label] = n; });
    var pairs = [];
    nodes.forEach(function(n){
      if(n.label.indexOf('×') !== -1) return; // handled from the plain side
      var negNode = labelToNode[n.label + '×'];
      if(negNode){ pairs.push({ baseId:n.id, negId:negNode.id, baseNode:n, negNode:negNode }); }
    });
    pairs.forEach(function(p){
      [p.baseNode, p.negNode].forEach(function(n){
        n.shape = 'box';
        n.shapeProperties = { borderRadius:0 };
        n.widthConstraint = { minimum:PAIR_BOX_W, maximum:PAIR_BOX_W };
        n.heightConstraint = { minimum:PAIR_BOX_H, maximum:PAIR_BOX_H };
        n.margin = 4;
      });
      p.negNode.physics = false; // position is slaved to its base node, see renderGraphView
    });

    // 6) final vis.js edges
    var visEdges = mergedEdges.map(function(e){
      var color;
      if(contradictionIds[e.id]) color = CONTRADICTION_COLOR;
      else if(e.colorRole === 'conclusion') color = CONCLUSION_COLOR;
      else if(e.colorRole === 'premise') color = PREMISE_COLOR;
      else color = NO_ROLE_COLOR;
      return { id:e.id, from:nodeMap.get(e.fromLabel), to:nodeMap.get(e.toLabel),
        dashes: !e.solid, arrows:'to',
        color:{ color:color, highlight:color },
        width: contradictionIds[e.id] ? 3 : 2,
        smooth:{ type:'continuous' } };
    });

    // 7) triples for the double-click show/hide behaviour, resolved to the
    // (now possibly shared/merged) edge ids
    var triples = [];
    rawByGroup.forEach(function(gInfo){
      if(!gInfo.hasTriangle || gInfo.edges.length !== 3) return;
      var e1 = gInfo.edges[0], e2 = gInfo.edges[1], e3 = gInfo.edges[2];
      var eid1 = edgeKeyToId[e1.fromLabel + '\u0001' + e1.toLabel];
      var eid2 = edgeKeyToId[e2.fromLabel + '\u0001' + e2.toLabel];
      var eid3 = edgeKeyToId[e3.fromLabel + '\u0001' + e3.toLabel];
      if(!eid1 || !eid2 || !eid3) return;
      triples.push({ middleNodeId: nodeMap.get(gInfo.middleLabel),
        premiseEdgeIds:[eid1, eid2], conclusionEdgeId:eid3, midHidden:false, conclHidden:false });
    });

    return { nodes:nodes, edges:visEdges, triples:triples, pairs:pairs, mergedEdges:mergedEdges };
  }

  // ---------------------------------------------------------------
  // Whole-graph statistics: disconnected components, bridge ("weak
  // connection") edges, premise/conclusion arrow counts, and how many
  // groups form a defective triangle.
  // ---------------------------------------------------------------
  function countComponents(nodes, edges){
    var adj = {};
    nodes.forEach(function(n){ adj[n.id] = []; });
    edges.forEach(function(e){ adj[e.from].push(e.to); adj[e.to].push(e.from); });
    var seen = {}, count = 0;
    nodes.forEach(function(n){
      if(seen[n.id]) return;
      count++;
      var queue = [n.id]; seen[n.id] = true;
      while(queue.length){
        var cur = queue.shift();
        adj[cur].forEach(function(nb){ if(!seen[nb]){ seen[nb] = true; queue.push(nb); } });
      }
    });
    return count;
  }

  // Bridge edges (Tarjan's algorithm, multigraph-safe via edge id) whose
  // removal would split the graph, keeping only ones that separate two
  // genuinely sized chunks (>=2 nodes each side) rather than just lopping
  // off a single leaf node.
  function countWeakBridges(nodes, edges){
    var adj = {};
    nodes.forEach(function(n){ adj[n.id] = []; });
    edges.forEach(function(e){
      adj[e.from].push({ to:e.to, eid:e.id });
      adj[e.to].push({ to:e.from, eid:e.id });
    });
    var visited = {}, disc = {}, low = {}, subtreeSize = {};
    var timer = 0;
    var candidates = []; // {eid, smallerSide, root}
    function dfs(u, parentEdgeId, root){
      visited[u] = true;
      disc[u] = low[u] = timer++;
      subtreeSize[u] = 1;
      adj[u].forEach(function(edge){
        if(edge.eid === parentEdgeId) return;
        if(!visited[edge.to]){
          dfs(edge.to, edge.eid, root);
          subtreeSize[u] += subtreeSize[edge.to];
          low[u] = Math.min(low[u], low[edge.to]);
          if(low[edge.to] > disc[u]){
            candidates.push({ eid:edge.eid, smallerSide:subtreeSize[edge.to], root:root });
          }
        } else {
          low[u] = Math.min(low[u], disc[edge.to]);
        }
      });
    }
    nodes.forEach(function(n){ if(!visited[n.id]) dfs(n.id, null, n.id); });
    var weak = 0;
    candidates.forEach(function(c){
      var componentTotal = subtreeSize[c.root];
      var otherSide = componentTotal - c.smallerSide;
      if(c.smallerSide >= 2 && otherSide >= 2) weak++;
    });
    return weak;
  }

  // Counted from the DEDUPLICATED arrow set, not raw input rows — a merged
  // arrow that is a conclusion anywhere counts as a conclusion (conclusion
  // wins ties), so this is no longer a fixed 2:1 shape.
  function countPremiseConclusion(mergedEdges){
    var premise = 0, conclusion = 0;
    mergedEdges.forEach(function(e){
      if(e.statsRole === 'conclusion') conclusion++; else premise++;
    });
    return { premise:premise, conclusion:conclusion };
  }

  // Per-syllogism-set "triangle" defects: a set is expected to draw as a
  // closed triangle of 3 nodes / 3 arrows. Flags: the triangle never even
  // closes (disconnected/incomplete/mismatched terms), it closes but every
  // side is a dashed(어떤) arrow, or it closes but every node is negated(×).
  function analyzeTriangles(groupedRaw){
    var noTriangle = 0, dashedOnly = 0, xOnly = 0, totalDefective = 0;
    groupedRaw.forEach(function(group){
      var filledCount = group.rows.filter(function(r){ return r.subj && r.pred; }).length;
      if(filledCount === 0) return; // untouched set, not a "defect"
      var defective = false;
      if(filledCount !== 3){
        noTriangle++; defective = true;
      } else {
        var edges = computeGroupEdges(group);
        var labelSet = {};
        edges.forEach(function(e){ labelSet[e.fromLabel] = 1; labelSet[e.toLabel] = 1; });
        var distinct = Object.keys(labelSet);
        if(distinct.length !== 3){
          noTriangle++; defective = true;
        } else {
          if(edges.every(function(e){ return !e.solid; })){ dashedOnly++; defective = true; }
          if(distinct.every(function(l){ return l.indexOf('×') !== -1; })){ xOnly++; defective = true; }
        }
      }
      if(defective) totalDefective++;
    });
    return { noTriangle:noTriangle, dashedOnly:dashedOnly, xOnly:xOnly, total:totalDefective };
  }

  function computeGraphStats(bundle, groupedRaw){
    var components = countComponents(bundle.nodes, bundle.edges);
    var weakBridges = countWeakBridges(bundle.nodes, bundle.edges);
    var pc = countPremiseConclusion(bundle.mergedEdges);
    var ratio = pc.conclusion > 0 ? (pc.premise / pc.conclusion) : null;
    var defects = analyzeTriangles(groupedRaw);
    return {
      components: components,
      weakBridges: weakBridges,
      premise: pc.premise,
      conclusion: pc.conclusion,
      totalArrows: pc.premise + pc.conclusion,
      ratio: ratio,
      defects: defects
    };
  }

  function renderGraphStats(stats){
    var grid = document.getElementById('statsGrid');
    if(!grid) return;
    var ratioText = stats.ratio === null ? 'N/A' : (stats.ratio.toFixed(2) + ' : 1');
    grid.innerHTML =
      '<div class="stat-chip' + (stats.components > 1 ? ' warn' : ' ok') + '">' +
        '<div class="stat-value">' + stats.components + '<b>개</b></div>' +
        '<div class="stat-label">분리된 그룹(연결 요소)</div>' +
      '</div>' +
      '<div class="stat-chip' + (stats.weakBridges > 0 ? ' warn' : '') + '">' +
        '<div class="stat-value">' + stats.weakBridges + '<b>개</b></div>' +
        '<div class="stat-label">약한 연결 — 화살표 하나로만 이어진 다리</div>' +
      '</div>' +
      '<div class="stat-chip">' +
        '<div class="stat-value">' + stats.totalArrows + '<b>개</b></div>' +
        '<div class="stat-label">전체 화살표</div>' +
        '<div class="stat-sub">가정 ' + stats.premise + ' · 결론 ' + stats.conclusion + '</div>' +
      '</div>' +
      '<div class="stat-chip">' +
        '<div class="stat-value">' + ratioText + '</div>' +
        '<div class="stat-label">결론 화살표 대비 가정 화살표 비율</div>' +
      '</div>' +
      '<div class="stat-chip' + (stats.defects.total > 0 ? ' warn' : ' ok') + '">' +
        '<div class="stat-value">' + stats.defects.total + '<b>개</b></div>' +
        '<div class="stat-label">논리적으로 결함이 있는 삼각형</div>' +
        '<div class="stat-sub">미형성 ' + stats.defects.noTriangle + ' · 점선만 ' + stats.defects.dashedOnly + ' · X만 ' + stats.defects.xOnly + '</div>' +
      '</div>';
  }

  // ---------------------------------------------------------------
  // 9 valid categorical syllogism templates
  // t: A(모든~이다) / E(모든~아니다) / I(어떤~이다) / O(어떤~아니다)
  // ---------------------------------------------------------------
  var TEMPLATES = [
    {id:1, s1:{t:'A',s:'M',p:'P'}, s2:{t:'A',s:'S',p:'M'}, c:{t:'A',s:'S',p:'P'}, desc:'모든 M은 P이다 · 모든 S는 M이다 → 모든 S는 P이다'},
    {id:2, s1:{t:'A',s:'M',p:'P'}, s2:{t:'A',s:'M',p:'S'}, c:{t:'I',s:'S',p:'P'}, desc:'모든 M은 P이다 · 모든 M은 S이다 → 어떤 S는 P이다'},
    {id:3, s1:{t:'A',s:'P',p:'M'}, s2:{t:'A',s:'M',p:'S'}, c:{t:'I',s:'S',p:'P'}, desc:'모든 P는 M이다 · 모든 M은 S이다 → 어떤 S는 P이다'},
    {id:4, s1:{t:'E',s:'M',p:'P'}, s2:{t:'A',s:'S',p:'M'}, c:{t:'E',s:'S',p:'P'}, desc:'모든 M은 P가 아니다 · 모든 S는 M이다 → 모든 S는 P가 아니다'},
    {id:5, s1:{t:'E',s:'M',p:'P'}, s2:{t:'A',s:'M',p:'S'}, c:{t:'O',s:'S',p:'P'}, desc:'모든 M은 P가 아니다 · 모든 M은 S이다 → 어떤 S는 P가 아니다'},
    {id:6, s1:{t:'A',s:'M',p:'P'}, s2:{t:'I',s:'S',p:'M'}, c:{t:'I',s:'S',p:'P'}, desc:'모든 M은 P이다 · 어떤 S는 M이다 → 어떤 S는 P이다'},
    {id:7, s1:{t:'E',s:'M',p:'P'}, s2:{t:'I',s:'S',p:'M'}, c:{t:'O',s:'S',p:'P'}, desc:'모든 M은 P가 아니다 · 어떤 S는 M이다 → 어떤 S는 P가 아니다'},
    {id:8, s1:{t:'A',s:'P',p:'M'}, s2:{t:'O',s:'S',p:'M'}, c:{t:'O',s:'S',p:'P'}, desc:'모든 P는 M이다 · 어떤 S는 M이 아니다 → 어떤 S는 P가 아니다'},
    {id:9, s1:{t:'O',s:'M',p:'P'}, s2:{t:'A',s:'M',p:'S'}, c:{t:'O',s:'S',p:'P'}, desc:'어떤 M은 P가 아니다 · 모든 M은 S이다 → 어떤 S는 P가 아니다'}
  ];

  var SHAPES_TABLE = {
    1:{M:'circle',S:'circle',P:'fan'},
    2:{M:'circle',S:'fan',P:'fan'},
    3:{M:'circle',S:'fan',P:'circle'},
    4:{M:'circle',S:'circle',P:'fan'},
    5:{M:'circle',S:'fan',P:'fan'},
    6:{M:'circle',S:'fan',P:'fan'},
    7:{M:'circle',S:'fan',P:'fan'},
    8:{M:'circle',S:'fan',P:'fan'},
    9:{M:'circle',S:'fan',P:'fan'}
  };
  // NOTE on 8 and 9: as typed by the user these two moods have the middle
  // term M as the SUBJECT of both premises, which — taken literally — only
  // gives "M contained in X" and "M contained in Y" with no stated relation
  // between X and Y, so a single connected diagram isn't directly available.
  // Both moods have one PARTICULAR premise though, and a particular premise
  // ("어떤 A는 B(가 아니다)") can always be restated with subject and
  // predicate swapped without changing its meaning (그것은 그냥
  // "A이고 B" ↔ "B이고 A" 의 순서를 바꾼 것과 같음), which turns the fork
  // into a genuine chain:
  //   8: "모든 P는 M이다" + "어떤 S는 M이 아니다" -> rewrite premise 1 as
  //      its contrapositive "모든 M이 아닌 것은 P가 아니다" (M×⊂P×), which
  //      now shares M× with premise 2's predicate -> P× ⊃ M× ⊃ S.
  //   9: "어떤 M은 P가 아니다" + "모든 M은 S이다" -> restate premise 1 as
  //      "어떤 P가 아닌 것은 M이다" (P×⊂M), which now shares M with
  //      premise 2's subject -> S ⊃ M ⊃ P×.
  // Both rewrites are logically equivalent to what the user typed; only the
  // diagram's internal layout uses them, the validity check above still
  // matches the sentences exactly as entered.
  var LAYOUT_TABLE = {
    1:{type:'chain', order:['P','M','S'], negRoles:[]},
    2:{type:'chain', order:['P','S','M'], negRoles:[]},
    3:{type:'chain', order:['S','M','P'], negRoles:[]},
    4:{type:'chain', order:['P','M','S'], negRoles:['P']},
    5:{type:'chain', order:['P','S','M'], negRoles:['P']},
    6:{type:'chain', order:['P','M','S'], negRoles:[]},
    7:{type:'chain', order:['P','M','S'], negRoles:['P']},
    8:{type:'chain', order:['P','M','S'], negRoles:['P','M']},
    9:{type:'chain', order:['S','M','P'], negRoles:['P']}
  };

  function typeOf(r){ return r.quant === '모든' ? (r.predNeg ? 'E' : 'A') : (r.predNeg ? 'O' : 'I'); }

  // A statement typed with subject negation ("M이 아닌 것은 …") is often
  // just an equivalent restatement of a plain statement, and should be
  // recognised as such rather than rejected outright:
  //   - 모든 A가 아닌 것은 B가 아니다  ==  모든 B는 A이다   (contraposition)
  //   - 어떤 A가 아닌 것은 B이다      ==  어떤 B는 A가 아니다 (particular statements
  //     just assert "A and B together", so subject/predicate freely swap)
  // Anything else with subject negation doesn't reduce to a plain form and
  // is left unmatched (returns null).
  function normalizeStatement(r){
    if(!r.subjNeg) return r;
    if(r.quant === '모든' && r.predNeg){
      return { quant:'모든', subj:r.pred, subjNeg:false, pred:r.subj, predNeg:false };
    }
    if(r.quant === '어떤' && !r.predNeg){
      return { quant:'어떤', subj:r.pred, subjNeg:false, pred:r.subj, predNeg:true };
    }
    return null;
  }

  function matchGroup(rows){
    if(rows.length !== 3) return null;
    var normRows = rows.map(normalizeStatement);
    if(normRows.some(function(r){ return r === null; })) return null;
    var c = normRows[2];
    var premiseOrders = [[0,1],[1,0]];
    for(var ti=0; ti<TEMPLATES.length; ti++){
      var T = TEMPLATES[ti];
      for(var oi=0; oi<premiseOrders.length; oi++){
        var i1 = premiseOrders[oi][0], i2 = premiseOrders[oi][1];
        var p1 = normRows[i1], p2 = normRows[i2];
        var roleMap = {}, wordMap = {};
        function assign(word, role){
          if(!word) return false;
          if(roleMap[word] && roleMap[word] !== role) return false;
          if(wordMap[role] && wordMap[role] !== word) return false;
          roleMap[word] = role; wordMap[role] = word;
          return true;
        }
        var ok = typeOf(p1) === T.s1.t && assign(p1.subj, T.s1.s) && assign(p1.pred, T.s1.p);
        if(ok) ok = typeOf(p2) === T.s2.t && assign(p2.subj, T.s2.s) && assign(p2.pred, T.s2.p);
        if(ok) ok = typeOf(c) === T.c.t && assign(c.subj, T.c.s) && assign(c.pred, T.c.p);
        if(ok && wordMap.M && wordMap.S && wordMap.P){
          var uniq = {}; uniq[wordMap.M]=1; uniq[wordMap.S]=1; uniq[wordMap.P]=1;
          if(Object.keys(uniq).length === 3){
            return { template:T, roleToWord:wordMap, p1RowIndex:i1, p2RowIndex:i2 };
          }
        }
      }
    }
    return null;
  }

  function evaluateGroupSyllogism(group){
    if(!group.complete) return { status:'incomplete', groupIndex:group.index };
    var m = matchGroup(group.rows);
    if(!m) return { status:'invalid', groupIndex:group.index };
    var id = m.template.id;
    var layout = LAYOUT_TABLE[id];
    var shapes = SHAPES_TABLE[id];
    function itemFor(role){
      var neg = layout.negRoles.indexOf(role) !== -1;
      return { role:role, label: labelOf(m.roleToWord[role], neg), shape: shapes[role] };
    }
    var result = { status:'valid', groupIndex:group.index, templateId:id, templateDesc:m.template.desc, diagramType:layout.type };
    if(layout.type === 'chain'){
      result.items = layout.order.map(itemFor);
    } else {
      result.clusters = layout.clusters.map(function(rolesArr, ci){
        return rolesArr.map(function(role){
          var neg = (layout.negCluster === ci) && layout.negRoles.indexOf(role) !== -1;
          return { role:role, label: labelOf(m.roleToWord[role], neg), shape: shapes[role] };
        });
      });
    }
    return result;
  }

  // ---------------------------------------------------------------
  // Contradiction & cycle checks (global, across all filled rows)
  // ---------------------------------------------------------------
  function findContradictions(rawList){
    var issues = [];
    var map = {};
    rawList.forEach(function(r){
      var subjLabel = labelOf(r.subj, r.subjNeg);
      var key = subjLabel + '\u0001' + r.pred;
      map[key] = map[key] || [];
      map[key].push(r);
    });
    Object.keys(map).forEach(function(key){
      var list = map[key];
      var hasA=false, hasE=false, hasI=false, hasO=false;
      list.forEach(function(r){
        var all = (r.quant === '모든');
        if(all && !r.predNeg) hasA = true;
        if(all && r.predNeg) hasE = true;
        if(!all && !r.predNeg) hasI = true;
        if(!all && r.predNeg) hasO = true;
      });
      var parts = key.split('\u0001');
      var subjLabel = parts[0], predBase = parts[1];
      if(hasA && hasO){ issues.push('모순: "모든 ' + subjLabel + '는 ' + predBase + '이다"와 "어떤 ' + subjLabel + '는 ' + predBase + '가 아니다"가 함께 성립할 수 없습니다.'); }
      if(hasE && hasI){ issues.push('모순: "모든 ' + subjLabel + '는 ' + predBase + '가 아니다"와 "어떤 ' + subjLabel + '는 ' + predBase + '이다"가 함께 성립할 수 없습니다.'); }
    });
    return issues;
  }

  function findCycles(rawList){
    var adj = {};
    rawList.forEach(function(r){
      var from = labelOf(r.subj, r.subjNeg), to = labelOf(r.pred, r.predNeg);
      adj[from] = adj[from] || [];
      adj[from].push(to);
    });
    var issues = [];
    var visited = {}, onStack = {}, reported = {};
    function dfs(node, path){
      visited[node] = true; onStack[node] = true; path.push(node);
      (adj[node] || []).forEach(function(next){
        if(!visited[next]){ dfs(next, path.slice()); }
        else if(onStack[next]){
          var start = path.indexOf(next);
          var cyclePath = path.slice(start).concat(next);
          var key = cyclePath.slice().sort().join('>');
          if(!reported[key]){ reported[key] = true; issues.push('순환 논리: ' + cyclePath.join(' → ') + ' 로 되돌아오는 고리가 있습니다.'); }
        }
      });
      onStack[node] = false;
    }
    Object.keys(adj).forEach(function(n){ if(!visited[n]) dfs(n, []); });
    return issues;
  }

  function renderEvalList(groupResults, contradictions, cycles){
    var ul = document.getElementById('evalList');
    ul.innerHTML = '';
    function addLi(text, cls){
      var li = document.createElement('li');
      li.textContent = text;
      if(cls) li.className = cls;
      ul.appendChild(li);
    }
    var anyProblem = false;
    groupResults.forEach(function(g){
      if(g.status === 'valid'){
        addLi('세트 ' + g.groupIndex + ': 올바른 삼단논법입니다 (형식 ' + g.templateId + ' — ' + g.templateDesc + ')', 'ok');
      } else if(g.status === 'invalid'){
        anyProblem = true;
        addLi('세트 ' + g.groupIndex + ': 9가지 표준 형식 중 어느 것과도 일치하지 않습니다 — 틀린 논법입니다.', null);
      }
    });
    contradictions.forEach(function(msg){ anyProblem = true; addLi(msg, null); });
    cycles.forEach(function(msg){ anyProblem = true; addLi(msg, null); });
    if(!anyProblem){ addLi('발견된 논리적 결함이 없습니다. 모든 세트가 표준 삼단논법 형식에 부합합니다.', 'ok'); }
  }

  // =================================================================
  // DIAGRAM: real pie-slice "fan" (부채꼴) shapes, nested, physics
  // (spring/magnet) draggable — every non-root shape is ALWAYS hard-
  // clamped to stay strictly inside its parent shape's true boundary,
  // and releasing a shape lets the whole set settle back into place.
  // =================================================================
  var CELL_W = 260, CELL_H = 300;
  var BETA = 46 * Math.PI / 180;   // fan half-angle
  var MARGIN = 0.82;               // how much of the parent's room a child uses
  var SPRING_K = 0.16;             // parent<->child spring stiffness
  var HOME_K = 0.09;               // root -> home-position spring stiffness
  var DAMPING = 0.72;              // velocity damping per tick
  var SETTLE_EPS = 0.04;           // velocity magnitude considered "at rest"
  var SETTLE_MAX_TICKS = 240;      // safety cap so the loop always stops

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // compute a child frame that sits fully inside the parent frame (initial layout)
  function childFrame(parent, childType){
    if(parent.type === 'circle'){
      if(childType === 'circle'){
        return { type:'circle', x:parent.x, y:parent.y, r:parent.r*MARGIN };
      }
      return { type:'fan', x:parent.x, y:parent.y, r:parent.r*MARGIN, beta:BETA };
    }
    if(childType === 'circle'){
      var R = parent.r, beta = parent.beta;
      var d = (R/(1+Math.sin(beta))) * MARGIN;
      var rho = (R*Math.sin(beta)/(1+Math.sin(beta))) * MARGIN;
      return { type:'circle', x:parent.x+d, y:parent.y, r:rho };
    }
    return { type:'fan', x:parent.x, y:parent.y, r:parent.r*MARGIN, beta:parent.beta*0.82 };
  }

  // ---- STRICT containment: a child (footprint circle of radius r, since a
  // fan's own points are all within r of its vertex) must stay fully inside
  // the parent's ACTUAL boundary — two straight edges + the arc for a fan,
  // or the plain radius for a circle. Iterative projection keeps this exact
  // even under fast dragging.
  function clampCircleInCircle(cx,cy,cr, px,py,pr){
    var dx = cx-px, dy = cy-py, dist = Math.hypot(dx,dy);
    var maxDist = Math.max(0, pr-cr);
    if(dist > maxDist){
      if(dist < 1e-6) return { x:px+maxDist, y:py };
      var k = maxDist/dist;
      return { x:px+dx*k, y:py+dy*k };
    }
    return { x:cx, y:cy };
  }
  function clampInFan(cx,cy,cr, parent){
    var lx = cx-parent.x, ly = cy-parent.y;
    var sB = Math.sin(parent.beta), cB = Math.cos(parent.beta);
    for(var i=0;i<5;i++){
      var d1 = lx*sB - ly*cB;
      if(d1 < cr){ var def1 = cr-d1; lx += def1*sB; ly += -def1*cB; }
      var d2 = lx*sB + ly*cB;
      if(d2 < cr){ var def2 = cr-d2; lx += def2*sB; ly += def2*cB; }
      var dist = Math.hypot(lx,ly);
      var maxDist = Math.max(0, parent.r-cr);
      if(dist > maxDist){
        if(dist < 1e-6){ lx = maxDist; ly = 0; }
        else { var k = maxDist/dist; lx *= k; ly *= k; }
      }
    }
    return { x:parent.x+lx, y:parent.y+ly };
  }
  function clampChildInParent(cx,cy,cr, parent){
    return parent.type === 'circle' ? clampCircleInCircle(cx,cy,cr, parent.x,parent.y,parent.r) : clampInFan(cx,cy,cr, parent);
  }

  // build the frame tree (flat array with parent indices) for one group's diagram
  function buildFrames(groupResult){
    var frames = [];
    if(groupResult.diagramType === 'chain'){
      var items = groupResult.items;
      var root = { type:'fan', x:64, y:150, r:78, beta:BETA, label:items[0].label, role:items[0].role, parent:-1, vx:0, vy:0 };
      root.homeX = root.x; root.homeY = root.y;
      frames.push(root);
      var prev = root;
      for(var i=1;i<items.length;i++){
        var f = childFrame(prev, items[i].shape);
        f.label = items[i].label; f.role = items[i].role; f.parent = frames.length-1; f.vx=0; f.vy=0;
        f.idealDX = f.x - prev.x; f.idealDY = f.y - prev.y;
        frames.push(f);
        prev = f;
      }
    } else { // split (template 8)
      var c0 = groupResult.clusters[0], c1 = groupResult.clusters[1];
      var root0 = { type:'fan', x:46, y:160, r:46, beta:BETA, label:c0[0].label, role:c0[0].role, parent:-1, vx:0, vy:0 };
      root0.homeX = root0.x; root0.homeY = root0.y;
      frames.push(root0);
      var child0 = childFrame(root0, c0[1].shape);
      child0.label = c0[1].label; child0.role = c0[1].role; child0.parent = 0; child0.vx=0; child0.vy=0;
      child0.idealDX = child0.x-root0.x; child0.idealDY = child0.y-root0.y;
      frames.push(child0);

      var root1 = { type:'fan', x:172, y:160, r:46, beta:BETA, label:c1[0].label, role:c1[0].role, parent:-1, vx:0, vy:0 };
      root1.homeX = root1.x; root1.homeY = root1.y;
      frames.push(root1);
      var child1 = childFrame(root1, c1[1].shape);
      child1.label = c1[1].label; child1.role = c1[1].role; child1.parent = 2; child1.vx=0; child1.vy=0;
      child1.idealDX = child1.x-root1.x; child1.idealDY = child1.y-root1.y;
      frames.push(child1);
    }
    return frames;
  }

  function fanPathD(x,y,r,beta){
    var a1 = -beta, a2 = beta;
    var p1 = [x + r*Math.cos(a1), y + r*Math.sin(a1)];
    var p2 = [x + r*Math.cos(a2), y + r*Math.sin(a2)];
    var largeArc = (2*beta > Math.PI) ? 1 : 0;
    return 'M '+x.toFixed(1)+','+y.toFixed(1)+' L '+p1[0].toFixed(1)+','+p1[1].toFixed(1)+
      ' A '+r.toFixed(1)+','+r.toFixed(1)+' 0 '+largeArc+' 1 '+p2[0].toFixed(1)+','+p2[1].toFixed(1)+' Z';
  }

  function frameShapeSVG(f, idx){
    var negated = f.label.indexOf('×') !== -1;
    var isCircle = (f.type === 'circle');
    var stroke = negated ? '#e08585' : (isCircle ? '#e8c468' : '#7fb3d5');
    var fill = negated ? 'rgba(224,133,133,0.16)' : (isCircle ? 'rgba(232,196,104,0.20)' : 'rgba(127,179,213,0.20)');
    var shapeMarkup;
    if(isCircle){
      shapeMarkup = '<circle cx="'+f.x.toFixed(1)+'" cy="'+f.y.toFixed(1)+'" r="'+f.r.toFixed(1)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
    } else {
      shapeMarkup = '<path d="'+fanPathD(f.x,f.y,f.r,f.beta)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2" stroke-linejoin="round"/>';
    }
    var hasChild = f.hasChild;
    var lx, ly;
    if(isCircle){
      lx = f.x; ly = hasChild ? (f.y - f.r*0.6) : f.y;
    } else {
      lx = hasChild ? (f.x - f.r*0.28) : (f.x + f.r*0.42);
      ly = f.y - (hasChild ? f.r*0.12 : 0);
    }
    var label = '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="'+(negated?'#e08585':'#f3f1e7')+'" style="pointer-events:none;">'+esc(f.label)+'</text>';
    return '<g class="diagram-shape" data-fidx="'+idx+'">' + shapeMarkup + label + '</g>';
  }

  function renderFramesInto(gEl, frames){
    var html = '';
    frames.forEach(function(f, i){ f.hasChild = frames.some(function(o){ return o.parent === i; }); });
    frames.forEach(function(f, i){ html += frameShapeSVG(f, i); });
    gEl.innerHTML = html;
  }

  // ---------------------------------------------------------------
  // Spring ("magnet") physics: dragged shape is kinematic (follows the
  // pointer); every other shape is pulled toward its ideal relative
  // offset from its parent (and pulls its parent back too), so tugging
  // any one shape drags the rest of the set along naturally. A hard
  // containment clamp runs every tick (root-to-leaf) so an inner shape
  // can never even momentarily poke outside its parent.
  // ---------------------------------------------------------------
  function physicsTick(frames, draggedIdx, desired){
    if(draggedIdx !== null && draggedIdx !== undefined){
      frames[draggedIdx].x = desired.x; frames[draggedIdx].y = desired.y;
      frames[draggedIdx].vx = 0; frames[draggedIdx].vy = 0;
    }
    var fx = frames.map(function(){ return 0; });
    var fy = frames.map(function(){ return 0; });

    frames.forEach(function(f, i){
      if(f.parent === -1){
        if(i === draggedIdx) return;
        fx[i] += (f.homeX - f.x) * HOME_K;
        fy[i] += (f.homeY - f.y) * HOME_K;
      } else {
        var p = frames[f.parent];
        var childX = (i === draggedIdx) ? desired.x : f.x;
        var childY = (i === draggedIdx) ? desired.y : f.y;
        // pull child toward parent + idealOffset
        if(i !== draggedIdx){
          fx[i] += ((p.x + f.idealDX) - f.x) * SPRING_K;
          fy[i] += ((p.y + f.idealDY) - f.y) * SPRING_K;
        }
        // pull parent toward child - idealOffset (so dragging a child tugs its parent along)
        if(f.parent !== draggedIdx){
          fx[f.parent] += ((childX - f.idealDX) - p.x) * SPRING_K;
          fy[f.parent] += ((childY - f.idealDY) - p.y) * SPRING_K;
        }
      }
    });

    frames.forEach(function(f, i){
      if(i === draggedIdx) return;
      f.vx = (f.vx + fx[i]) * DAMPING;
      f.vy = (f.vy + fy[i]) * DAMPING;
      f.x += f.vx; f.y += f.vy;
    });

    // hard containment clamp, root -> leaf (frames array is already in that order)
    frames.forEach(function(f){
      if(f.parent === -1) return;
      var p = frames[f.parent];
      var res = clampChildInParent(f.x, f.y, f.r, p);
      f.x = res.x; f.y = res.y;
    });
    // keep roots loosely within the visible cell
    frames.forEach(function(f){
      if(f.parent !== -1) return;
      f.x = Math.max(f.r*0.2, Math.min(CELL_W - f.r*0.2, f.x));
      f.y = Math.max(f.r*0.2, Math.min(CELL_H - 40 - f.r*0.2, f.y));
    });
  }

  function maxSpeed(frames){
    var m = 0;
    frames.forEach(function(f){ m = Math.max(m, Math.hypot(f.vx||0, f.vy||0)); });
    return m;
  }

  // one global animation driver shared by every group's shape-set
  var activeSim = null;      // { entry, frameIdx, desired, dragging, settleTicks }
  var simRunning = false;

  function tickPhysics(){
    if(!activeSim){ simRunning = false; return; }
    var entry = activeSim.entry, frames = entry.frames;
    var draggedIdx = activeSim.dragging ? activeSim.frameIdx : null;
    physicsTick(frames, draggedIdx, activeSim.desired);
    renderFramesInto(entry.el, frames);

    if(!activeSim.dragging){
      activeSim.settleTicks = (activeSim.settleTicks||0) + 1;
      if(maxSpeed(frames) < SETTLE_EPS || activeSim.settleTicks > SETTLE_MAX_TICKS){
        activeSim = null; simRunning = false; return;
      }
    }
    requestAnimationFrame(tickPhysics);
  }

  function startSim(entry, frameIdx, desired){
    activeSim = { entry:entry, frameIdx:frameIdx, desired:desired, dragging:true, settleTicks:0 };
    if(!simRunning){ simRunning = true; requestAnimationFrame(tickPhysics); }
  }

  // ---------------------------------------------------------------
  // Build the full diagram (multi-group grid) as an interactive SVG
  // ---------------------------------------------------------------
  var diagramState = null; // { scale, panX, panY }

  function buildDiagramInto(container, groupResults){
    activeSim = null; simRunning = false;
    container.innerHTML = '';
    container.classList.add('diagram-mode');
    var n = groupResults.length;
    if(n === 0){
      container.innerHTML = '<p class="hint" style="padding:20px;">표시할 세트가 없습니다.</p>';
      return;
    }
    var cols = n <= 1 ? 1 : (n === 2 ? 2 : Math.min(3, Math.ceil(Math.sqrt(n))));
    var rows = Math.ceil(n / cols);
    var W = cols * CELL_W, H = rows * CELL_H;

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('width', W); svg.setAttribute('height', H);

    var bgRect = document.createElementNS(svgNS,'rect');
    bgRect.setAttribute('x',0); bgRect.setAttribute('y',0);
    bgRect.setAttribute('width',W); bgRect.setAttribute('height',H);
    bgRect.setAttribute('fill','#212b2d');
    bgRect.setAttribute('class','diagram-bg');
    svg.appendChild(bgRect);

    var viewport = document.createElementNS(svgNS,'g');
    viewport.setAttribute('id','diagramViewport');
    svg.appendChild(viewport);

    var entries = []; // {el, frames}

    groupResults.forEach(function(g, i){
      var col = i % cols, row = Math.floor(i / cols);
      var ox = col * CELL_W, oy = row * CELL_H;
      var cellG = document.createElementNS(svgNS,'g');
      cellG.setAttribute('transform','translate('+ox+','+oy+')');
      viewport.appendChild(cellG);

      var cx = CELL_W/2;
      if(g.status === 'valid'){
        var shapesG = document.createElementNS(svgNS,'g');
        cellG.appendChild(shapesG);
        var frames = buildFrames(g);
        renderFramesInto(shapesG, frames);
        entries.push({ el:shapesG, frames:frames });

        var cap1 = document.createElementNS(svgNS,'text');
        cap1.setAttribute('x',cx); cap1.setAttribute('y',260); cap1.setAttribute('text-anchor','middle');
        cap1.setAttribute('font-family','IBM Plex Mono, monospace'); cap1.setAttribute('font-size','12'); cap1.setAttribute('fill','#8fcb9b');
        cap1.textContent = '세트 ' + g.groupIndex + ' · 형식 ' + g.templateId;
        cellG.appendChild(cap1);

        var cap2 = document.createElementNS(svgNS,'text');
        cap2.setAttribute('x',cx); cap2.setAttribute('y',278); cap2.setAttribute('text-anchor','middle');
        cap2.setAttribute('font-family','IBM Plex Sans KR, sans-serif'); cap2.setAttribute('font-size','10'); cap2.setAttribute('fill','#a9b6b4');
        cap2.textContent = g.templateDesc;
        cellG.appendChild(cap2);
      } else if(g.status === 'invalid'){
        cellG.innerHTML =
          '<rect x="26" y="55" width="'+(CELL_W-52)+'" height="130" rx="10" fill="rgba(224,133,133,0.07)" stroke="#e08585" stroke-width="1.5" stroke-dasharray="6 5"/>' +
          '<text x="'+cx+'" y="115" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" fill="#e08585">×</text>' +
          '<text x="'+cx+'" y="145" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="#e08585">올바른 삼단논법 형식이 아닙니다</text>' +
          '<text x="'+cx+'" y="260" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#e08585">세트 '+g.groupIndex+'</text>';
      } else {
        cellG.innerHTML =
          '<rect x="26" y="55" width="'+(CELL_W-52)+'" height="130" rx="10" fill="rgba(169,182,180,0.05)" stroke="#a9b6b4" stroke-width="1.5" stroke-dasharray="4 4"/>' +
          '<text x="'+cx+'" y="125" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="11.5" fill="#a9b6b4">입력이 완료되지 않았습니다</text>' +
          '<text x="'+cx+'" y="260" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#a9b6b4">세트 '+g.groupIndex+' (미완성)</text>';
      }
    });

    container.appendChild(svg);

    // ---- pan & zoom ----
    diagramState = { scale:1, panX:0, panY:0 };
    function applyTransform(){
      viewport.setAttribute('transform','translate('+diagramState.panX+','+diagramState.panY+') scale('+diagramState.scale+')');
    }
    applyTransform();
    function clampScale(s){ return Math.max(0.4, Math.min(3, s)); }

    svg.addEventListener('wheel', function(e){
      e.preventDefault();
      var factor = e.deltaY > 0 ? 0.9 : 1.1;
      diagramState.scale = clampScale(diagramState.scale * factor);
      applyTransform();
    }, { passive:false });

    var panning = false, panStart = null, panOrigin = null;
    bgRect.addEventListener('pointerdown', function(e){
      panning = true;
      panStart = { x:e.clientX, y:e.clientY };
      panOrigin = { x:diagramState.panX, y:diagramState.panY };
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', function(e){
      if(!panning) return;
      diagramState.panX = panOrigin.x + (e.clientX - panStart.x);
      diagramState.panY = panOrigin.y + (e.clientY - panStart.y);
      applyTransform();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(evt){
      svg.addEventListener(evt, function(){ panning = false; });
    });

    var zc = document.createElement('div');
    zc.className = 'zoom-controls';
    zc.innerHTML = '<button type="button" data-z="in">+</button><button type="button" data-z="out">−</button><button type="button" data-z="reset">⤾</button>';
    container.appendChild(zc);
    zc.addEventListener('click', function(e){
      var btn = e.target.closest('button'); if(!btn) return;
      if(btn.dataset.z === 'in') diagramState.scale = clampScale(diagramState.scale*1.2);
      else if(btn.dataset.z === 'out') diagramState.scale = clampScale(diagramState.scale/1.2);
      else { diagramState.scale=1; diagramState.panX=0; diagramState.panY=0; }
      applyTransform();
    });

    // ---- shape dragging (spring physics + hard containment clamp) ----
    function localPoint(evt, refEl){
      var pt = svg.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      var ctm = refEl.getScreenCTM();
      if(!ctm) return {x:0,y:0};
      var loc = pt.matrixTransform(ctm.inverse());
      return { x:loc.x, y:loc.y };
    }

    entries.forEach(function(entry){
      var shapesG = entry.el, frames = entry.frames;
      var dragOffset = null;

      shapesG.addEventListener('pointerdown', function(e){
        var target = e.target.closest('.diagram-shape');
        if(!target) return;
        e.stopPropagation();
        var fidx = parseInt(target.getAttribute('data-fidx'), 10);
        var p = localPoint(e, shapesG);
        dragOffset = { x:p.x - frames[fidx].x, y:p.y - frames[fidx].y };
        startSim(entry, fidx, { x:frames[fidx].x, y:frames[fidx].y });
        shapesG.setPointerCapture(e.pointerId);
      });

      shapesG.addEventListener('pointermove', function(e){
        if(!activeSim || activeSim.entry !== entry || !activeSim.dragging) return;
        e.stopPropagation();
        var p = localPoint(e, shapesG);
        activeSim.desired = { x:p.x - dragOffset.x, y:p.y - dragOffset.y };
      });

      ['pointerup','pointercancel'].forEach(function(evt){
        shapesG.addEventListener(evt, function(){
          if(activeSim && activeSim.entry === entry){
            activeSim.dragging = false;
            activeSim.settleTicks = 0;
          }
        });
      });
    });
  }

  function legendIcon(shape){
    if(shape === 'circle'){ return '<circle cx="8" cy="8" r="7" fill="rgba(232,196,104,0.25)" stroke="#e8c468" stroke-width="1.5"/>'; }
    return '<path d="'+fanPathD(8,8,7,BETA)+'" fill="rgba(127,179,213,0.25)" stroke="#7fb3d5" stroke-width="1.5"/>';
  }

  // ---------------------------------------------------------------
  // Network / diagram view rendering & switching
  // ---------------------------------------------------------------
  var network = null;
  var currentGraphBundle = null;   // {nodes, edges, triples}
  var currentNodesDS = null, currentEdgesDS = null;
  var currentGroupResults = null;
  var isDiagram = false;

  var graphOptions = {
    nodes:{ shape:'ellipse', font:{ face:'IBM Plex Mono', size:16 }, borderWidth:2 },
    edges:{ arrows:{ to:{ enabled:true, scaleFactor:0.7 } }, smooth:{ type:'continuous' } },
    physics:{ enabled:true, solver:'forceAtlas2Based',
      forceAtlas2Based:{ gravitationalConstant:-70, springLength:130, springConstant:0.06, avoidOverlap:0.6 },
      stabilization:{ iterations:180 } },
    interaction:{ dragNodes:true, dragView:true, zoomView:true, hover:true }
  };

  function renderGraphView(){
    var container = document.getElementById('network');
    container.classList.remove('diagram-mode');
    container.innerHTML = '';
    currentNodesDS = new vis.DataSet(currentGraphBundle.nodes);
    currentEdgesDS = new vis.DataSet(currentGraphBundle.edges);
    network = new vis.Network(container, { nodes:currentNodesDS, edges:currentEdgesDS }, graphOptions);

    // Keep every X / X× pair fused together as a two-tone capsule: X× has
    // no physics of its own and is pinned right next to X every frame.
    if(currentGraphBundle.pairs && currentGraphBundle.pairs.length){
      network.on('afterDrawing', function(){
        var baseIds = currentGraphBundle.pairs.map(function(p){ return p.baseId; });
        var positions = network.getPositions(baseIds);
        currentGraphBundle.pairs.forEach(function(p){
          var basePos = positions[p.baseId];
          if(basePos){ network.moveNode(p.negId, basePos.x + PAIR_BOX_W, basePos.y); }
        });
      });
    }

    network.on('doubleClick', function(params){
      if(params.nodes && params.nodes.length === 1){
        var nid = params.nodes[0];
        currentGraphBundle.triples.forEach(function(t){
          if(t.middleNodeId === nid){
            t.conclHidden = !t.conclHidden;
            currentEdgesDS.update({ id:t.conclusionEdgeId, hidden:t.conclHidden });
          }
        });
      } else if(params.edges && params.edges.length === 1 && (!params.nodes || params.nodes.length === 0)){
        var eid = params.edges[0];
        currentGraphBundle.triples.forEach(function(t){
          if(t.conclusionEdgeId === eid){
            t.midHidden = !t.midHidden;
            currentNodesDS.update({ id:t.middleNodeId, hidden:t.midHidden });
            currentEdgesDS.update([
              { id:t.premiseEdgeIds[0], hidden:t.midHidden },
              { id:t.premiseEdgeIds[1], hidden:t.midHidden }
            ]);
          }
        });
      }
    });

    document.getElementById('dragHint').textContent =
      '노드를 드래그해서 위치를 옮길 수 있습니다. X/X× 쌍은 하나의 캡슐처럼 붙어서 함께 움직입니다. 가운데(중간 개념) 노드를 더블클릭하면 결론 화살표를, 결론 화살표를 더블클릭하면 중간 노드를 숨기거나 다시 보이게 할 수 있습니다.';
    document.getElementById('legendBox').innerHTML =
      '<span><i class="ls-solid"></i> 모든 (전칭)</span>' +
      '<span><i class="ls-dashed"></i> 어떤 (특칭)</span>' +
      '<span><i class="ls-premise"></i> 가정 화살표</span>' +
      '<span><i class="ls-conclusion"></i> 결론 화살표</span>' +
      '<span><i class="ls-exception"></i> 역할 불명 (삼각형 미형성)</span>' +
      '<span><i class="ls-contradiction"></i> 모순 (같은 노드에서 X·X× 모두로 전칭)</span>' +
      '<span><b>×</b> 부정(아니다)</span>';
  }

  function renderDiagramView(){
    if(network){ network.destroy(); network = null; }
    var container = document.getElementById('network');
    buildDiagramInto(container, currentGroupResults);
    document.getElementById('dragHint').textContent =
      '도형을 드래그하면 자석처럼 서로 끌어당기며 나머지 도형도 함께 따라 움직입니다 (안쪽 도형은 바깥 도형을 절대 벗어나지 않습니다). 손을 떼면 자연스럽게 제자리로 정렬됩니다. 휠이나 우측 하단 버튼으로 확대·축소, 빈 공간 드래그로 화면 이동이 가능합니다.';
    document.getElementById('legendBox').innerHTML =
      '<span><svg width="16" height="16">' + legendIcon('circle') + '</svg> 원 = 전칭(모든)</span>' +
      '<span><svg width="16" height="16">' + legendIcon('fan') + '</svg> 부채꼴 = 특칭(어떤)</span>' +
      '<span><b>×</b> 부정(아니다)</span>';
  }

  function renderCurrentView(){
    if(isDiagram){ renderDiagramView(); } else { renderGraphView(); }
  }

  // ---------------------------------------------------------------
  // View switching / main actions
  // ---------------------------------------------------------------
  var inputView = document.getElementById('inputView');
  var resultView = document.getElementById('resultView');

  document.getElementById('doneBtn').addEventListener('click', function(){
    var flat = collectFlatRaw();
    if(flat.length === 0){ alert('최소 한 문장 이상 단어를 입력해주세요.'); return; }
    var grouped = collectGroupedRaw();
    currentGraphBundle = buildGraphAndTriples(grouped);
    currentGroupResults = grouped.map(evaluateGroupSyllogism);

    var contradictions = findContradictions(flat);
    var cycles = findCycles(flat);

    isDiagram = false;
    inputView.classList.add('hidden');
    resultView.classList.remove('hidden');
    document.getElementById('viewTitle').textContent = '논리 그래프';
    document.getElementById('toggleBtn').textContent = '다이어그램으로 보기';

    renderCurrentView();
    renderGraphStats(computeGraphStats(currentGraphBundle, grouped));
    renderEvalList(currentGroupResults, contradictions, cycles);
  });

  document.getElementById('toggleBtn').addEventListener('click', function(){
    isDiagram = !isDiagram;
    document.getElementById('viewTitle').textContent = isDiagram ? '논리 다이어그램' : '논리 그래프';
    document.getElementById('toggleBtn').textContent = isDiagram ? '그래프로 보기' : '다이어그램으로 보기';
    renderCurrentView();
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    resultView.classList.add('hidden');
    inputView.classList.remove('hidden');
  });

  document.getElementById('saveImgBtn').addEventListener('click', function(){
    if(isDiagram){
      var svgEl = document.querySelector('#network svg');
      if(!svgEl){ alert('저장할 다이어그램이 없습니다.'); return; }
      var xml = new XMLSerializer().serializeToString(svgEl);
      var w = parseInt(svgEl.getAttribute('width'), 10) || 800;
      var h = parseInt(svgEl.getAttribute('height'), 10) || 600;
      var img = new Image();
      var svgData = 'data:image/svg+xml;charset=utf-8;base64,' + btoa(unescape(encodeURIComponent(xml)));
      img.onload = function(){
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        triggerDownload(canvas.toDataURL('image/png'), '삼단논법_다이어그램.png');
      };
      img.onerror = function(){ alert('이미지 저장에 실패했습니다.'); };
      img.src = svgData;
    } else {
      if(!network){ return; }
      try{
        var canvas2 = network.canvas.frame.canvas;
        triggerDownload(canvas2.toDataURL('image/png'), '삼단논법_그래프.png');
      }catch(err){ alert('이미지 저장에 실패했습니다: ' + err.message); }
    }
  });

  function triggerDownload(url, filename){
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

})();
</script>
</body>
</html>
